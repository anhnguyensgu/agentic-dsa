[[exercise]]
name = "dynamic2"
file = "exercises/07_slices_dynamic/dynamic2.odin"
readme = "exercises/07_slices_dynamic/README.md"
mode = "test"
hint = """
The test passes `&list`, so the parameter is `list: ^[dynamic]string`.
It's already a pointer then: `append(list, item)`, no `&`."""

[[exercise]]
name = "dynamic3"
file = "exercises/07_slices_dynamic/dynamic3.odin"
readme = "exercises/07_slices_dynamic/README.md"
mode = "test"
hint = """
`ordered_remove(xs, i)` takes the same arguments and keeps the order."""

[[exercise]]
name = "dynamic4"
file = "exercises/07_slices_dynamic/dynamic4.odin"
readme = "exercises/07_slices_dynamic/README.md"
mode = "test"
hint = """
`append` returns how many elements it added: 1 if there was room, 0 if not.
Comparing `len(party)` with `cap(party)` before appending works too."""

