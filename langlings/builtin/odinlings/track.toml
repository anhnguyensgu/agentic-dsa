readme = "exercises/07_slices_dynamic/README.md"
mode = "test"
hint = """
The compiler suggests it: declare the loop variable as `&x` to make it mutable.
For the second test, `s := a[1:]` starts at `a[1]`, so `s[0]` *is* `a[1]`."""

[[exercise]]
name = "dynamic1"
file = "exercises/07_slices_dynamic/dynamic1.odin"
readme = "exercises/07_slices_dynamic/README.md"
mode = "test"
hint = """
`append(&result, i * i)`. It takes the array's address because growing may
