# odinlings: small fix-the-code exercises for Odin, in the spirit of rustlings.
# The order follows the Odin overview (https://odin-lang.org/docs/overview/)
# and the demo file (examples/demo/demo.odin). The course source, with
# solutions and dev/verify.sh, is langlings/builtin/odinlings.

root = "../odinlings"
run = "mkdir -p .build && odin run {file} -file -out:.build/{name}"
test = "mkdir -p .build && odin test {file} -file -out:.build/{name} -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -define:ODIN_TEST_LOG_LEVEL=warning -define:ODIN_TEST_FANCY=false -define:ODIN_TEST_SHORT_LOGS=true"

# 00 intro

[[exercise]]
name = "intro1"
file = "exercises/00_intro/intro1.odin"
readme = "exercises/00_intro/README.md"
expect = """
Hellope! Welcome to odinlings.
Fix each exercise, save the file, and watch it pass."""
hint = "Nothing to fix here. Press `n` to move on."

[[exercise]]
name = "intro2"
file = "exercises/00_intro/intro2.odin"
readme = "exercises/00_intro/README.md"
expect = "Hellope!"
hint = """
The compiler says `fmt` is an undeclared name.
Packages from the standard library come in with `import "core:fmt"`,
placed after the `package` line."""

# 01 variables

[[exercise]]
name = "variables1"
file = "exercises/01_variables/variables1.odin"
readme = "exercises/01_variables/README.md"
expect = "x has the value 5"
hint = """
`x = 5` assigns to a variable that already exists.
To declare a new one and let Odin infer its type, use `:=`."""

[[exercise]]
name = "variables2"
file = "exercises/01_variables/variables2.odin"
readme = "exercises/01_variables/README.md"
expect = "x is 3.5"
hint = """
`x := 10` infers `int` from the literal, and an `int` can't hold 3.5.
Start `x` from a floating-point literal (`10.0`) or give it a type: `x: f64 = 10`."""

[[exercise]]
name = "variables3"
file = "exercises/01_variables/variables3.odin"
readme = "exercises/01_variables/README.md"
expect = "Zero values checked!"
hint = """
Odin zero-initializes everything: numbers are 0, strings are "",
booleans are false. `???` isn't valid syntax, so replace all four."""

[[exercise]]
name = "variables4"
file = "exercises/01_variables/variables4.odin"
readme = "exercises/01_variables/README.md"
expect = "lives: 3"
hint = """
The error says the array count must be a constant.
`name :: value` declares a compile-time constant; `name := value` declares a variable."""

[[exercise]]
name = "variables5"
file = "exercises/01_variables/variables5.odin"
readme = "exercises/01_variables/README.md"
expect = """
number is 5
number is 15"""
hint = """
`number := ...` declares a second `number` in the same scope, which Odin rejects.
You don't need a new variable here, just a new value: assign with `=`."""

[[exercise]]
name = "variables6"
file = "exercises/01_variables/variables6.odin"
readme = "exercises/01_variables/README.md"
expect = "a = 2, b = 1"
hint = """
After `a = b`, the old value of `a` is gone.
Odin evaluates every right-hand value first in a multiple assignment: `a, b = b, a`."""

# 02 procedures

[[exercise]]
name = "procedures1"
file = "exercises/02_procedures/procedures1.odin"
readme = "exercises/02_procedures/README.md"
hint = """
`main` calls `call_me`, which doesn't exist yet.
Declare it at the top level: `call_me :: proc() { ... }`."""

[[exercise]]
name = "procedures2"
file = "exercises/02_procedures/procedures2.odin"
readme = "exercises/02_procedures/README.md"
expect = """
Ring! Call number 1
Ring! Call number 2
Ring! Call number 3"""
hint = """
Every parameter needs a type: `name: Type`. The compiler reads `proc(num)` as
an unnamed parameter whose *type* is `num`, which is why it says `num` is
undeclared. `num` is used as a count, so `int` fits."""

[[exercise]]
name = "procedures3"
file = "exercises/02_procedures/procedures3.odin"
readme = "exercises/02_procedures/README.md"
expect = """
Hellope, Ada!
Good morning, Bill!"""
hint = """
A default value goes where the type is: `greeting := "Hellope"`
(or `greeting: string = "Hellope"`). Callers can then leave the argument out."""

[[exercise]]
name = "procedures4"
file = "exercises/02_procedures/procedures4.odin"
readme = "exercises/02_procedures/README.md"
expect = "Your sale price is 48"
hint = """
The procedure returns a value, but its signature doesn't say so.
Results go after `->`: `proc(price: int) -> int`."""

[[exercise]]
name = "procedures5"
file = "exercises/02_procedures/procedures5.odin"
readme = "exercises/02_procedures/README.md"
mode = "test"
hint = """
`largest` starts as the first number but is never updated.
Mirror the `smallest` check with `n > largest`."""

[[exercise]]
name = "procedures6"
file = "exercises/02_procedures/procedures6.odin"
readme = "exercises/02_procedures/README.md"
expect = "100 0 42"
hint = """
You can't assign to a parameter, but you can declare a local variable with
the same name that starts as a copy of it: `score := score`."""

[[exercise]]
name = "procedures7"
file = "exercises/02_procedures/procedures7.odin"
readme = "exercises/02_procedures/README.md"
expect = """
0
6
9"""
hint = """
`sum(odds)` tries to pass the whole slice as one `int`.
Prefix the argument with `..` to spread it: `sum(..odds)`."""

[[exercise]]
name = "procedures8"
file = "exercises/02_procedures/procedures8.odin"
readme = "exercises/02_procedures/README.md"
expect = """
3
[4, 6]"""
hint = """
An overload group is a constant too: `add :: proc{add_ints, add_vectors}`.
Each call resolves to the member whose parameter types match."""

# 03 control flow

[[exercise]]
name = "if1"
file = "exercises/03_control_flow/if1.odin"
readme = "exercises/03_control_flow/README.md"
mode = "test"
hint = """
`if a > b { return a }` and then `return b` after it.
No parentheses around the condition, and the braces are required."""

[[exercise]]
name = "if2"
file = "exercises/03_control_flow/if2.odin"
readme = "exercises/03_control_flow/README.md"
mode = "test"
hint = """
Put the declaration before the condition with a semicolon:
`if r := a % b; r == 0 { ... }`. The `else if` branches can see `r` too."""

[[exercise]]
name = "if3"
file = "exercises/03_control_flow/if3.odin"
readme = "exercises/03_control_flow/README.md"
mode = "test"
hint = """
The shape is `value_if_true if condition else value_if_false`,
for example `-n if n < 0 else n`."""

[[exercise]]
name = "switch1"
file = "exercises/03_control_flow/switch1.odin"
readme = "exercises/03_control_flow/README.md"
mode = "test"
hint = """
Rune ranges work like number ranges: `case '0' ..= '9':`.
List several values in one case with commas: `case ' ', '\\t', '\\n':`."""

[[exercise]]
name = "switch2"
file = "exercises/03_control_flow/switch2.odin"
readme = "exercises/03_control_flow/README.md"
expect = """
fuel
ignition
liftoff"""
hint = """
Each case stops at its end. Write `fallthrough` as the last statement of a case
to continue into the next one. Two cases need it."""

[[exercise]]
name = "loops1"
file = "exercises/03_control_flow/loops1.odin"
readme = "exercises/03_control_flow/README.md"
mode = "test"
hint = """
The three parts are init, condition, post: `for i := 1; i <= n; i += 1`.
Odin has no `++`. A while loop drops the semicolons: `for n != 1 { ... }`."""

[[exercise]]
name = "loops2"
file = "exercises/03_control_flow/loops2.odin"
readme = "exercises/03_control_flow/README.md"
mode = "test"
hint = """
`for _ in s { count += 1 }` runs once per rune. `_` throws the value away.
For the second one, `for x, i in xs` gives you the index `i` next to the value."""

[[exercise]]
name = "loops3"
file = "exercises/03_control_flow/loops3.odin"
readme = "exercises/03_control_flow/README.md"
mode = "test"
hint = """
Label the outer loop with `search: for r in 0 ..< 3 {` and leave it with
`break search`. (A plain `return` would also do here.)"""

# 04 defer and when

[[exercise]]
name = "defer1"
file = "exercises/04_defer_when/defer1.odin"
readme = "exercises/04_defer_when/README.md"
expect = """
1. open the door
2. turn on the light
3. read a book
4. turn off the light
5. close the door"""
hint = """
A deferred line runs when `main` ends, and the last one deferred runs first.
Defer the "5." line and the "4." line."""

[[exercise]]
name = "defer2"
file = "exercises/04_defer_when/defer2.odin"
readme = "exercises/04_defer_when/README.md"
mode = "test"
hint = """
Go one statement at a time. A `{ }` block and each loop iteration are scopes of
their own, so their defers run at their closing brace. A deferred call reads
`x` when it runs, not when it was written. There are seven values."""

[[exercise]]
name = "when1"
file = "exercises/04_defer_when/when1.odin"
readme = "exercises/04_defer_when/README.md"
expect = "debug build"
hint = """
`debug_mode := true` is a variable, and its value is only known at run time.
Make it a constant with `::`, e.g. `DEBUG_MODE :: true`, and use that name in the `when`."""

[[exercise]]
name = "when2"
file = "exercises/04_defer_when/when2.odin"
readme = "exercises/04_defer_when/README.md"
cmd = "mkdir -p .build && odin run {file} -file -out:.build/{name} -define:GREETING=Hellope"
expect = "Hellope world"
hint = """
`GREETING :: #config(GREETING, "Hello")`. The first argument is the name used
with `-define`, the second is the default."""

