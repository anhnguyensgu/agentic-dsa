readme = "exercises/05_primitive_types/README.md"
mode = "test"
hint = """
Convert with the type name as a procedure: `rune(name[0])`.
For the uppercase letter, shift by the distance between the alphabets: `c - 'a' + 'A'`."""

[[exercise]]
name = "primitives3"
file = "exercises/05_primitive_types/primitives3.odin"
readme = "exercises/05_primitive_types/README.md"
expect = "Wow, that's a big array!"
