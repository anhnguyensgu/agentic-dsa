An array type is `[N]T`, and an empty compound literal zeroes it: `[100]int{}`."""

[[exercise]]
name = "primitives4"
file = "exercises/05_primitive_types/primitives4.odin"
readme = "exercises/05_primitive_types/README.md"
mode = "test"
hint = """
2 is at index 1 and 4 is at index 3. The end of a slice expression is
exclusive, so `a[1:4]`."""

[[exercise]]
name = "primitives5"
file = "exercises/05_primitive_types/primitives5.odin"
readme = "exercises/05_primitive_types/README.md"
mode = "test"
hint = """
`total / count` is an int division, and an `int` can't be returned as `f64`.
Convert both sides before dividing: `f64(total) / f64(count)`."""

[[exercise]]
name = "primitives6"
file = "exercises/05_primitive_types/primitives6.odin"
readme = "exercises/05_primitive_types/README.md"
mode = "test"
hint = """
`-1 % 5` is -1, but `-1 %% 5` is 4. For the u8 sum: 250 + 10 = 260, and a u8
counts modulo 256."""

